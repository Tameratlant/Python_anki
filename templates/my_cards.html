{% extends "base.html" %}

{% block content %}
<div class="cards-container">
    <h1>Мои карточки</h1>
    
    <div class="cards-grid">
        {% for card in cards %}
        <div class="card-item" style="border-left: 5px solid {{ {
            'red': '#ff7675',
            'blue': '#74b9ff',
            'green': '#55efc4',
            'yellow': '#ffeaa7'
        }[card.color] }}">
            <div class="card-content">
                <div class="card-front">{{ card.front_text }}</div>
                <div class="card-back">{{ card.back_text }}</div>
                <div class="card-tag">{{ card.tag }}</div>
                <div class="card-stats">
                    <span class="stat-correct">✓ {{ card.correct_answers }}</span>
                    <span class="stat-wrong">✗ {{ card.wrong_answers }}</span>
                </div>
            </div>
            <div class="card-actions">
                <a href="{{ url_for('edit_card', card_id=card.id) }}" class="edit-btn">
                    <!-- Иконка редактирования -->
                </a>
                <form action="{{ url_for('delete_card', card_id=card.id) }}" method="POST" class="delete-form">
                    <button type="submit" class="delete-btn">
                        <!-- Иконка удаления -->
                    </button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
